backend:
  name: github
  repo: clokyy/rfw-website
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
logo_url: "/assets/regina-fireworks-hero.jpg"
show_preview_links: true

collections:
  - name: "site"
    label: "Website"
    files:
      - name: "settings"
        label: "Products & contact details"
        file: "data/site.json"
        format: "json"
        fields:
          - {label: "Phone number shown", name: "phone_display", widget: "string", hint: "Example: (306) 530-9239"}
          - {label: "Phone number for links", name: "phone_link", widget: "string", hint: "Example: +13065309239"}
          - {label: "Street address", name: "address_line1", widget: "string"}
          - {label: "City", name: "city", widget: "string"}
          - {label: "Province", name: "province", widget: "string"}
          - {label: "Postal code", name: "postal_code", widget: "string"}
          - {label: "Email", name: "email", widget: "string", pattern: ["^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", "Enter a valid email address"]}
          - label: "Products"
            name: "products"
            widget: "list"
            label_singular: "Product"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - {label: "Product name", name: "name", widget: "string"}
              - {label: "Product code", name: "code", widget: "string", required: false}
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - {label: "Roman Candles", value: "roman-candles-consumer-fireworks"}
                  - {label: "Sound shells", value: "sound-shells"}
                  - {label: "Barrages", value: "barrages-en"}
                  - {label: "Maximum load mortars", value: "maximum-load-mortars"}
                  - {label: "Multishots Cakes", value: "cakes-bombardos-consumer-fireworks"}
                  - {label: "Angled Cakes", value: "angled-cakes"}
                  - {label: "Fireworks Kits", value: "fireworks-kits"}
                  - {label: "Ground Spinners", value: "ground-spinners"}
                  - {label: "Fountains", value: "fountains"}
                  - {label: "Sparklers", value: "sparklers-consumer-fireworks"}
                  - {label: "Miscellaneous", value: "miscellaneous"}
              - {label: "Type / shot count", name: "type", widget: "string"}
              - {label: "Price", name: "price", widget: "string", hint: "Example: $69.99 or Call for price"}
              - {label: "Description", name: "details", widget: "text"}
              - {label: "Product image", name: "image", widget: "image", required: false, hint: "Upload a square product photo or choose an existing image."}
              - {label: "Card colour", name: "theme", widget: "select", options: ["blue", "sunset", "pink", "amber", "violet"], default: "blue", hint: "Used when a product has no image."}
              - {label: "Show on website", name: "active", widget: "boolean", default: true}
